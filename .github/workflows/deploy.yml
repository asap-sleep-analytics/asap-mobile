name: Mobile Quality and OTA Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx jest --ci

  eas-update:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check EAS configuration
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::El secret EXPO_TOKEN no está configurado. Agrégalo en Settings > Secrets > Actions para publicar updates."
            exit 1
          fi
          if ! node -e "const p=require('./app.json'); if(!p.expo.extra?.eas?.projectId) process.exit(1)"; then
            echo "::error::Falta extra.eas.projectId en app.json. Córrelo localmente con 'eas init' y comparte el ID para agregarlo."
            exit 1
          fi

      - name: Configure Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update
        run: eas update --auto --branch production --non-interactive